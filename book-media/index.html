<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书影音推荐</title>
    <style>
 main{
    max-width:1200px;
    margin:0 auto;
    padding:0 16px;
}
h2{
    margin:20px 0;
}
.card-wrap{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(280px,1fr));
    gap:20px;
}
.card{
    border:1px solid #ccc;
    padding:16px;
    border-radius:8px;
}
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
nav{
    max-width: 1200px;
    margin: 0 auto;
    padding:16px;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
}
nav a{
    text-decoration:none;
    margin:0 8px;
}
footer{
    max-width:1200px;
    margin:40px auto;
    padding:16px;
    text-align:center;
}
    </style>
</head>
<body>
<nav>
    <div><strong>书影音推荐</strong></div>
    <div>
        <a href=" ">书籍</a >
        <a href="#">电影</a >
        <a href="#">音乐</a >
    </div>
</nav>
<main>
    <h2>精选推荐</h2>
<div class="card-wrap">
        <div class="card">
            <h4>书籍：活着</h4>
            <p>余华经典文学作品，讲述普通人的一生。</p >
        </div>
        <div class="card">
            <h4>书籍：三体</h4>
            <p>国产硬核科幻，宏大宇宙故事。</p >
        </div>
        <div class="card">
            <h4>电影：流浪地球</h4>
            <p>国产科幻灾难电影。</p >
        </div>
        <div class="card">
            <h4>电影：你好李焕英</h4>
            <p>温情喜剧亲情题材。</p >
        </div>
        <div class="card">
            <h4>音乐：晴天</h4>
            <p>经典华语流行歌曲。</p >
        </div>
        <div class="card">
            <h4>音乐：稻香</h4>
            <p>治愈向励志流行曲目。</p >
        </div>
    </div>
</main>
<footer>
<p>响应式网页实践作业</p >
</footer>
</body>
</html>
